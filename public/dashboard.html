<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muna IA — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #090E1A;
    --surface:   #111827;
    --border:    #1F2937;
    --green:     #10B981;
    --green-dim: rgba(16,185,129,0.12);
    --amber:     #F59E0B;
    --amber-dim: rgba(245,158,11,0.12);
    --blue:      #3B82F6;
    --blue-dim:  rgba(59,130,246,0.12);
    --red:       #EF4444;
    --text:      #F9FAFB;
    --muted:     #6B7280;
    --subtle:    #374151;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--green), #059669);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--muted); font-weight: 400; }

  .header-right { display: flex; align-items: center; gap: 16px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--green-dim); border: 1px solid var(--green);
    color: var(--green); padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }
  .refresh-btn {
    background: var(--subtle); border: none; color: var(--text);
    padding: 6px 14px; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-family: inherit; font-weight: 500;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: var(--border); }

  /* ── LAYOUT ── */
  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    position: relative; overflow: hidden;
  }
  .kpi::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
  }
  .kpi.green::before { background: var(--green); }
  .kpi.amber::before { background: var(--amber); }
  .kpi.blue::before  { background: var(--blue); }
  .kpi.red::before   { background: var(--red); }

  .kpi-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .kpi-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .kpi-value.green { color: var(--green); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.blue  { color: var(--blue); }
  .kpi-value.red   { color: var(--red); }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ── TWO-COL ── */
  .two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }

  /* ── PANELS ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .panel-count {
    background: var(--subtle); color: var(--muted);
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }

  /* ── TABLE ── */
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 10px 20px; text-align: left;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 20px;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  /* ── BADGES ── */
  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
  }
  .badge-active  { background: var(--green-dim); color: var(--green); }
  .badge-scoring { background: var(--amber-dim); color: var(--amber); }
  .badge-done    { background: var(--blue-dim);  color: var(--blue); }
  .badge-paid    { background: var(--green-dim); color: var(--green); }
  .badge-pending { background: var(--amber-dim); color: var(--amber); }
  .badge-failed  { background: rgba(239,68,68,.12); color: var(--red); }

  /* ── PAYMENT LIST ── */
  .payment-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .payment-item:last-child { border-bottom: none; }
  .payment-info { display: flex; flex-direction: column; gap: 2px; }
  .payment-type { font-size: 12px; font-weight: 600; }
  .payment-phone { font-size: 11px; color: var(--muted); font-family: monospace; }
  .payment-amount { font-size: 14px; font-weight: 700; color: var(--green); }
  .payment-date { font-size: 11px; color: var(--muted); text-align: right; }

  /* ── EMPTY STATE ── */
  .empty {
    padding: 40px 20px; text-align: center;
    color: var(--muted); font-size: 13px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }

  /* ── LOADING ── */
  .loading { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid var(--border); border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── PHONE FORMAT ── */
  .phone { font-family: monospace; font-size: 12px; color: var(--muted); }

  /* ── CANDIDATE COUNT ── */
  .count-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--subtle); color: var(--text);
    padding: 2px 8px; border-radius: 20px; font-size: 12px;
  }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div>
      <div class="logo-text">Muna IA</div>
      <div class="logo-sub">Dashboard Opérationnel</div>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span> EN DIRECT</div>
    <button class="refresh-btn" onclick="loadAll()">↻ Actualiser</button>
  </div>
</header>

<main>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi green">
      <div class="kpi-label">Offres actives</div>
      <div class="kpi-value green" id="stat-active">—</div>
      <div class="kpi-sub" id="stat-total-offers">sur — au total</div>
    </div>
    <div class="kpi blue">
      <div class="kpi-label">Candidatures reçues</div>
      <div class="kpi-value blue" id="stat-candidates">—</div>
      <div class="kpi-sub">total cumulé</div>
    </div>
    <div class="kpi amber">
      <div class="kpi-label">Revenus totaux</div>
      <div class="kpi-value amber" id="stat-revenue">—</div>
      <div class="kpi-sub">FCFA encaissés</div>
    </div>
    <div class="kpi red">
      <div class="kpi-label">Recrutements clôturés</div>
      <div class="kpi-value" id="stat-closed" style="color:#fff">—</div>
      <div class="kpi-sub">rapports envoyés</div>
    </div>
  </div>

  <!-- Two columns -->
  <div class="two-col">

    <!-- Offres d'emploi -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📋 Offres d'emploi</span>
        <span class="panel-count" id="offers-count">...</span>
      </div>
      <div id="offers-body">
        <div class="loading"><span class="spinner"></span>Chargement...</div>
      </div>
    </div>

    <!-- Paiements -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">💳 Paiements récents</span>
        <span class="panel-count" id="payments-count">...</span>
      </div>
      <div id="payments-body">
        <div class="loading"><span class="spinner"></span>Chargement...</div>
      </div>
    </div>

  </div>
</main>

<script>
  const PAYMENT_LABELS = {
    rapport_pdf:      '📄 Rapport PDF',
    cv_boost:         '⭐ CV Boost',
    feedback_refus:   '📋 Feedback IA',
    reecriture_cv:    '✏️ Réécriture CV',
    abonnement_starter: '📦 Abonnement',
  };

  async function fetchJson(url) {
    const r = await fetch(url);
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    return d.data;
  }

  async function loadStats() {
    try {
      const stats = await fetchJson('/api/stats');
      document.getElementById('stat-active').textContent    = stats.activeOffers;
      document.getElementById('stat-total-offers').textContent = `sur ${stats.totalOffers} au total`;
      document.getElementById('stat-candidates').textContent   = stats.totalApplications.toLocaleString('fr-FR');
      document.getElementById('stat-revenue').textContent      = stats.totalRevenue.toLocaleString('fr-FR');
      document.getElementById('stat-closed').textContent       = stats.totalOffers - stats.activeOffers;
    } catch (e) {
      console.error('Stats:', e);
    }
  }

  async function loadOffers() {
    try {
      const offers = await fetchJson('/api/offers');
      document.getElementById('offers-count').textContent = offers.length;

      if (!offers.length) {
        document.getElementById('offers-body').innerHTML =
          '<div class="empty"><div class="empty-icon">📭</div>Aucune offre pour l\'instant</div>';
        return;
      }

      const rows = offers.map(o => {
        const count = o.applications?.[0]?.count ?? 0;
        const status = o.status === 'active' ? 'badge-active' :
                       o.status === 'scoring' ? 'badge-scoring' : 'badge-done';
        const statusLabel = o.status === 'active' ? '● Actif' :
                            o.status === 'scoring' ? '⚙ Scoring' : '✓ Terminé';
        const date = new Date(o.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'2-digit' });
        return `<tr>
          <td><strong>${esc(o.title)}</strong><br><span class="phone">${esc(o.city || '—')}</span></td>
          <td><span class="count-pill">👥 ${count}</span></td>
          <td><code style="font-size:11px;background:rgba(255,255,255,.05);padding:2px 6px;border-radius:4px">MUNA-${esc(o.reference_code)}</code></td>
          <td><span class="badge ${status}">${statusLabel}</span></td>
          <td style="color:var(--muted);font-size:12px">${date}</td>
        </tr>`;
      }).join('');

      document.getElementById('offers-body').innerHTML = `
        <table>
          <thead><tr>
            <th>Poste / Ville</th>
            <th>Candidats</th>
            <th>Code</th>
            <th>Statut</th>
            <th>Date</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (e) {
      document.getElementById('offers-body').innerHTML = `<div class="empty">Erreur: ${e.message}</div>`;
    }
  }

  async function loadPayments() {
    try {
      const payments = await fetchJson('/api/payments');
      document.getElementById('payments-count').textContent = payments.length;

      if (!payments.length) {
        document.getElementById('payments-body').innerHTML =
          '<div class="empty"><div class="empty-icon">💸</div>Aucun paiement pour l\'instant</div>';
        return;
      }

      const items = payments.map(p => {
        const badgeClass = p.status === 'paid' ? 'badge-paid' : p.status === 'failed' ? 'badge-failed' : 'badge-pending';
        const badgeLabel = p.status === 'paid' ? '✓ Payé' : p.status === 'failed' ? '✗ Refusé' : '⏳ Attente';
        const date = new Date(p.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
        return `<div class="payment-item">
          <div class="payment-info">
            <span class="payment-type">${PAYMENT_LABELS[p.type] || p.type}</span>
            <span class="payment-phone">${esc(p.whatsapp_number)}</span>
          </div>
          <div style="text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
            <span class="payment-amount">+${p.amount.toLocaleString('fr-FR')} F</span>
            <span class="badge ${badgeClass}">${badgeLabel}</span>
            <span class="payment-date">${date}</span>
          </div>
        </div>`;
      }).join('');

      document.getElementById('payments-body').innerHTML = items;
    } catch (e) {
      document.getElementById('payments-body').innerHTML = `<div class="empty">Erreur: ${e.message}</div>`;
    }
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadAll() {
    await Promise.all([loadStats(), loadOffers(), loadPayments()]);
  }

  // Chargement initial
  loadAll();

  // Actualisation automatique toutes les 60 secondes
  setInterval(loadAll, 60000);
</script>
</body>
</html>
