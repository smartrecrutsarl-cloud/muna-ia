# Déploiement du site institutionnel Baobab Labs (dossier ./site).
# Site 100 % statique : aucune étape de build n'est nécessaire.

[build]
  publish = "site"
  command = ""

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 301

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 301

[[redirects]]
  from = "/vendly-confidentialite"
  to = "/vendly-confidentialite.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'"

# Les fichiers d'assets sont versionnés par leur contenu : cache long.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
